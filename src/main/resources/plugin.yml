name: StartFlow
version: ${version}
main: net.clodo.startflow.StartFlowPlugin
api-version: '1.21'
folia-supported: true
softdepend: [Vault, GriefPrevention, PlaceholderAPI]
commands:
  rehber:
    aliases: [guide, basla, başla, kurallar, rules]
    permission: startflow.use
  startflow:
    aliases: [sf]
    permission: startflow.admin
permissions:
  startflow.use:
    default: true
  startflow.admin:
    default: op
